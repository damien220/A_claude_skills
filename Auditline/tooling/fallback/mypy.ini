# mypy.ini: Auditline fallback, used only when the project has no mypy config.
# Generated by maintainer/gen_checklists.py. Do not edit by hand.
# Provenance: flags adapted from CodeWriter/python/tooling/mypy.ini @ ef073a0caec63238da443370319ecc90956f9764. Strict flags
# (disallow_untyped_defs and similar) are left off on purpose: a project that does not use them
# would drown the diff in findings. Missing stubs are not findings.
[mypy]
python_version = 3.10
check_untyped_defs = true
no_implicit_optional = true
warn_unreachable = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
no_error_summary = true
enable_error_code = unused-coroutine, truthy-bool, ignore-without-code
