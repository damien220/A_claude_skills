# mypy.ini — CodeWriter strict-ish type checking
#
# Makes the typing-and-contracts ref enforceable: untyped code and Any leakage fail.
# Run:  mypy --config-file mypy.ini src/
#
# Grounding: PEP 484/585/604 (typing model), mypy docs (strictness flags).
#
# NOTE: configparser does NOT strip inline "#" comments from values, so every option
# below keeps its explanation on its own line. Do not append "# ..." after a `true`.

[mypy]
python_version = 3.10

# --- The four flags plan.md names explicitly ---
# every function must be typed
disallow_untyped_defs = true
# flag functions that silently return Any
warn_return_any = true
# a `# type: ignore` that no longer applies is an error
warn_unused_ignores = true
# forbid always-false comparisons across disjoint types
strict_equality = true

# --- Companion flags that make the above meaningful ---
# partially-typed signatures are as bad as untyped ones
disallow_incomplete_defs = true
# still type-check bodies of any untyped defs that slip in
check_untyped_defs = true
# `x: int = None` must be written `x: int | None = None`
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

# Third-party libraries without stubs: silence import errors here, not with blanket ignores
# scattered through the code. Add one section per untyped dependency in the target repo, e.g.:
#
# [mypy-some_untyped_lib.*]
# ignore_missing_imports = true
